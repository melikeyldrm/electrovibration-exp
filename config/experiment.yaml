# Configuration for exp01: 2AFC absolute detection threshold for electrovibration.

session:
  experiment_id: exp01_2afc_threshold
  participant_id: sim_participant_01
  output_dir: data

display:
  # Physical calibration of the participant display, in millimetres.
  #
  # screen_width_px/height_px are physical resolution, not OS-scaled logical
  # pixels (this Qt build renders in physical pixels).
  #
  # TODO before any real session: measure the 3M touchscreen's active area
  # and use the resolution Windows reports for that display.
  screen_width_px: 2560
  screen_height_px: 1600
  screen_width_mm: 336.0
  screen_height_mm: 210.0
  # Run the participant window fullscreen. Set true for real sessions.
  fullscreen: false
  # Which physical monitor the participant window opens on, by index into
  # QApplication.screens() (0 = primary). Must be set for a real two-monitor
  # session; run with --list-screens to see indices.
  participant_screen_index:

staircase:
  # 3-down/1-up, targeting ~79.4% correct.
  # "3 correct" need not be consecutive - see consecutive_required below.
  rule: 3down1up
  domain: db
  start_value: 2.0
  # dB. Index advances on every reversal and saturates on the last entry:
  # 5 dB steps until the first reversal, then 1 dB for the rest of the session.
  step_sizes: [5.0, 1.0]
  n_reversals_to_stop: 5
  # Must be > 0 in db domain (log(0) is undefined). Session will never
  # realistically approach this floor given the 2V ceiling and 5/1 dB steps.
  min_value: 0.01
  # Hard safety ceiling on the DAQ analog output. The amplifier multiplies this
  # by 50x downstream, so this value must NEVER be exceeded regardless of
  # staircase state.
  max_value: 2.0
  # If a wrong answer lands at the ceiling this many times in a row, abort -
  # the participant isn't perceiving the max deliverable stimulus, continuing
  # wastes their time.
  max_consecutive_wrong_at_ceiling: 3
  # If false, a wrong answer steps up but does not reset the correct streak
  # (the 3 correct need not be consecutive). Set true to require consecutive.
  consecutive_required: false
  require_fine_stage_reversals: true

timing:
  # "Place your finger" wait screen, shown before each interval.
  pre_interval_wait_s: 3.0
  # Gap between interval 1 and 2. Left empty, scales with speed the same
  # way interval_s does. Set a number here to pin it to a fixed gap.
  gap_s_override:
  # interval_s is derived as cursor_travel_mm / cursor_speed_mm_s (see
  # TrialTiming.interval_s), so it depends on the speed condition.
  cursor_speed_mm_s: 50.0
  cursor_travel_mm: 100.0
  # Speed conditions offered in the setup dialog; fixed by the protocol.
  speed_options_mm_s: [20.0, 50.0, 80.0]

force:
  # Target normal force and the feedback colour scale around it: blue below
  # the band, green inside it, red above; full_scale_n is where the colour
  # saturates, not a hard cutoff.
  target_n: 1.0
  # Force conditions offered in the setup dialog; fixed by the protocol.
  force_levels_n: [0.5, 1.0, 1.5]
  full_scale_n: 0.5
  # Short moving average applied before colouring, in samples of the 20 Hz
  # UI poll (5 samples = 250 ms).
  smoothing_samples: 5
  # Half-width of the "on target" band for force_in_band_fraction. Left
  # unset it defaults to 30% of full_scale_n.
  in_band_half_width_n:
  # "mouse_y": experimenter drives force via pointer Y, for development.
  # "simulated": hands-off drifting signal. "nano17": live DAQ reading,
  # still reporting raw volts as newtons until the real .cal file replaces
  # ForceCalibration.placeholder().
  source: nano17 #nano17 or simulated

validity:
  # A trial is discarded (not logged, not fed to the staircase, presented
  # again at the same level) if mean force/speed strays from target by more
  # than this fraction. Skipped if that channel has no source configured.
  force_tolerance_pct: 15
  speed_tolerance_pct: 15

acquisition:
  sample_rate_hz: 10000
  # How much recent signal to keep in memory, to cut a trial out of after the fact.
  ring_seconds: 30
  # Samples per device read. Left empty to derive ~50 ms from the sample rate.
  chunk_samples:

training:
  n_trials: 3
  voltage: 2.0

simulation:
  # Only used by the headless run; ignored once a real participant responds.
  true_threshold_v: 1.2
  slope: 15.0
  max_trials: 300

debug:
  reveal_stimulus: false # to test