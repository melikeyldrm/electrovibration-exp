# Configuration for exp01: 2IFC absolute detection threshold for electrovibration.
# Trial structure follows Vardar & Kuchenbecker (2021) for the base 2IFC paradigm;
# the staircase rule (dB-domain 3-down/1-up), interval timing, and voltage safety
# ceiling follow the protocol supplied by Umut, based on Vuik/Pool/Kenanoglu/Vardar
# 2024/2025 (Impact of Whole-Body Vibrations on Electrovibration Perception).

session:
  experiment_id: exp01_2ifc_threshold
  participant_id: sim_participant_01
  output_dir: data

display:
  # Physical calibration of the participant display. Everything the
  # participant sees is laid out in millimetres and converted to pixels
  # through these numbers, so that the cue track is the same physical length
  # and the pacing cue the same physical speed in any window.
  #
  # TODO: MEASURE. Put a ruler against the ACTIVE (lit) area of the 3M
  # touchscreen - not the bezel - and record its width and height in mm,
  # together with the resolution Windows reports for that display. The values
  # below are a placeholder for a generic 21.5" 1920x1080 panel and are almost
  # certainly wrong for this setup.
  #
  # Do not substitute Qt's reported DPI: on Windows it usually returns the
  # logical 96 DPI, which yields a plausible-looking but incorrect calibration.
  screen_width_px: 1920
  screen_height_px: 1080
  screen_width_mm: 476.0
  screen_height_mm: 268.0
  # Run the participant window fullscreen. Set to true for real sessions: a
  # resized window narrower than the physical travel distance forces the
  # track to be shrunk to fit, which breaks the calibration. Left false
  # during development so the experimenter console stays reachable.
  fullscreen: false

staircase:
  # 3-down/1-up (Levitt 1971), targeting ~79.4% correct.
  # "3 correct" need not be consecutive - see consecutive_required below.
  rule: 3down1up
  domain: db  # step_sizes are interpreted as dB steps (20*log10(Vp)), not volts.
  # DAQ output starts at the safety ceiling and steps DOWN from there as the
  # participant answers correctly - matches "50 V ceiling, decrease on correct"
  # protocol structure, scaled here to our 2V DAQ-side ceiling (amplifier x50).
  start_value: 2.0
  # dB. Index advances on every reversal and saturates on the last entry:
  # 5 dB steps until the first reversal, then 1 dB for the rest of the session.
  step_sizes: [5.0, 1.0]
  n_reversals_to_stop: 5
  # Must be > 0 in db domain (log(0) is undefined). Session will never
  # realistically approach this floor given the 2V ceiling and 5/1 dB steps.
  min_value: 0.01
  # Hard safety ceiling on the DAQ analog output. The amplifier multiplies this
  # by 50x downstream, so this value must NEVER be exceeded regardless of
  # staircase state.
  max_value: 2.0
  # If a wrong answer lands at the ceiling this many times in a row, abort -
  # the participant isn't perceiving the max deliverable stimulus, continuing
  # wastes their time.
  max_consecutive_wrong_at_ceiling: 5
  # "gave three correct answers (not necessarily consecutive)": a wrong answer
  # triggers an immediate up-step but does NOT reset the cumulative correct
  # counter. Set to true to restore classic Levitt (correct streak must be
  # consecutive) - no code change needed, only this flag.
  consecutive_required: false
  require_fine_stage_reversals: true

timing:
  # "Place your finger" wait screen, shown before EACH interval (both red and
  # green), not just once per trial.
  pre_interval_wait_s: 3.0
  interval_s: 4.0
  gap_s: 2.0
  # Physical pace the cue asks for. The cue travels at this speed and reverses
  # at each end of the track, continuing for the whole interval - so interval
  # duration and sliding speed are set independently, and stimulus duration
  # stays constant across speed conditions.
  #
  # At 50 mm/s over a 100 mm track this reproduces the protocol exactly: one
  # two-second stroke out and one two-second stroke back per four-second
  # interval (Vuik/Pool/Kenanoglu/Vardar 2024/2025). At other speeds the
  # number of strokes per interval changes instead, which follows the
  # fixed-duration convention used by AliAbbasi et al. (2024).
  #
  # OPEN QUESTION for Umut: at 20 and 80 mm/s, should the interval duration
  # stay fixed (stroke count varies, and a 20 mm/s stroke does not complete),
  # or should the travel distance scale with speed so that every condition is
  # exactly one stroke out and back?
  cursor_speed_mm_s: 50.0
  cursor_travel_mm: 100.0
  # Speed conditions offered in the setup dialog. Free-text entry is
  # deliberately not allowed: the conditions are fixed by the protocol, so
  # any other value is a typo, and a typo here is invisible until analysis.
  speed_options_mm_s: [20.0, 50.0, 80.0]

training:
  n_trials: 3
  voltage: 2.0  # updated to match the new 2V DAQ-side scale

simulation:
  # Only used by the headless run; ignored once a real participant responds.
  # NOTE: expressed in the new 0-2V DAQ scale, not the old 0-150V scale.
  true_threshold_v: 1.2
  slope: 15.0
  max_trials: 300

debug:
  reveal_stimulus: true # to test