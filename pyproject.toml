[project]
name = "evexp"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.5",
    "PyQt5>=5.15",
    "PyYAML>=6.0",
    "matplotlib>=3.11",
    "nidaqmx>=1.5",
    "hidapi>=0.15",
    "pytest>=9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]